paths:
  cam-casa-01-frente:
    source: publisher
  cam-casa-01-frente-raw:
    source: rtsp://pietrojr2:guglielmi007310899@192.168.1.28:554/stream2
    sourceOnDemand: yes
    rtspTransport: tcp

  cam-portao:
    source: publisher
  cam-portao-raw:
    source: 'rtsp://admin:Gug.007310899@192.168.1.5:554/cam/realmonitor?channel=1&subtype=1'
    sourceOnDemand: yes
    rtspTransport: tcp

  cam-portao-canal-7:
    source: publisher
  cam-portao-canal-7-raw:
    source: 'rtsp://admin:Gug.007310899@192.168.1.5:554/cam/realmonitor?channel=7&subtype=1'
    sourceOnDemand: yes
