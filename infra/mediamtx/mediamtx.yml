# MediaMTX - RTSP -> HLS (para tocar dentro do app)
# Guia completo: infra/mediamtx/README.md

logLevel: info

# Protocolos habilitados
rtsp: yes
hls: yes
api: yes

# Enderecos
rtspAddress: :8554
hlsAddress: :8888
apiAddress: :9997

# DVRs (como Giga/Dahua) podem ficar alguns segundos sem pacotes.
# Aumenta tolerancia para evitar quedas intermitentes de publish.
readTimeout: 30s
writeTimeout: 30s

# Melhor para app mobile (deixa o HLS pronto continuamente)
hlsAlwaysRemux: yes
# Melhor compatibilidade com players Android (ExoPlayer/MediaPlayer)
hlsVariant: mpegts
# Segmentos curtos para reduzir atraso ponta-a-ponta.
hlsSegmentDuration: 1s
hlsSegmentCount: 6
# Evita bloqueio de CORS em fallback WebView/player web.
hlsAllowOrigins: ["*"]

# Autenticacao interna (troque as senhas)
authMethod: internal
authInternalUsers:
  # Permite leitura HLS sem credencial para paths de camera (evita falha de auth em alguns players Android).
  # Se quiser mais restrito, troque ips para sua rede local (ex: ['192.168.1.0/24']).
  - user: any
    pass:
    permissions:
      - action: read
        path: "~^cam-.*$"
      - action: playback
        path: "~^cam-.*$"
  - user: admin
    pass: admin
    permissions:
      - action: api
      - action: metrics
      - action: playback
  # Usuario interno para o ffmpeg republicar stream otimizada.
  - user: publisher
    pass: publisher123
    permissions:
      - action: publish
        path: "~^cam-.*$"

# Uma path por camera
